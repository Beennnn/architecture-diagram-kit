  <g><rect x="880" y="540" width="300" height="130" rx="8" fill="#22272E" stroke="#7B8894" stroke-width="1.6" stroke-dasharray="5 4"/><svg x="892" y="554" width="30" height="30" viewBox="0 0 48 48"><rect width="48" height="48" rx="13" fill="#f9eeed"/><svg x="9" y="9" width="30" height="30" viewBox="0 0 24 24" fill="none" stroke="#C0392F" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path stroke="none" d="M0 0h24v24H0z" fill="none" /><path d="M16.555 3.843l3.602 3.602a2.877 2.877 0 0 1 0 4.069l-2.643 2.643a2.877 2.877 0 0 1 -4.069 0l-.301 -.301l-6.558 6.558a2 2 0 0 1 -1.239 .578l-.175 .008h-1.172a1 1 0 0 1 -.993 -.883l-.007 -.117v-1.172a2 2 0 0 1 .467 -1.284l.119 -.13l.414 -.414h2v-2h2v-2l2.144 -2.144l-.301 -.301a2.877 2.877 0 0 1 0 -4.069l2.643 -2.643a2.877 2.877 0 0 1 4.069 0" /><path d="M15 9h.01" /></svg></svg><text x="930" y="568" font-size="13.5" font-weight="600" fill="#E9EDF0">Banque</text><text x="930" y="583" font-size="10.5" fill="#9FADB9">système externe</text><text x="892" y="608" font-size="10.5" fill="#9FADB9">Prélève le montant facturé sur le mandat du</text><text x="892" y="622" font-size="10.5" fill="#9FADB9">conducteur.</text></g>
