  <g><rect x="40" y="120" width="250" height="150" rx="10" fill="#2E353D" stroke="#8A96A2" stroke-width="1.6"/><svg x="52" y="134" width="30" height="30" viewBox="0 0 48 48"><rect width="48" height="48" rx="13" fill="#eff0f1"/><svg x="9" y="9" width="30" height="30" viewBox="0 0 24 24" fill="none" stroke="#4C5A66" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path stroke="none" d="M0 0h24v24H0z" fill="none" /><path d="M8 7a4 4 0 1 0 8 0a4 4 0 0 0 -8 0" /><path d="M6 21v-2a4 4 0 0 1 4 -4h4a4 4 0 0 1 4 4v2" /></svg></svg><text x="90" y="148" font-size="13.5" font-weight="600" fill="#E9EDF0">Conducteur</text><text x="90" y="163" font-size="10.5" fill="#9FADB9">personne</text><text x="52" y="188" font-size="10.5" fill="#9FADB9">Recharge son véhicule, consulte son</text><text x="52" y="202" font-size="10.5" fill="#9FADB9">historique et reçoit une facture mensuelle.</text></g>
  <g><rect x="40" y="330" width="250" height="150" rx="10" fill="#2E353D" stroke="#8A96A2" stroke-width="1.6"/><svg x="52" y="344" width="30" height="30" viewBox="0 0 48 48"><rect width="48" height="48" rx="13" fill="#eff0f1"/><svg x="9" y="9" width="30" height="30" viewBox="0 0 24 24" fill="none" stroke="#4C5A66" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path stroke="none" d="M0 0h24v24H0z" fill="none" /><path d="M5 7a4 4 0 1 0 8 0a4 4 0 1 0 -8 0" /><path d="M3 21v-2a4 4 0 0 1 4 -4h4a4 4 0 0 1 4 4v2" /><path d="M16 3.13a4 4 0 0 1 0 7.75" /><path d="M21 21v-2a4 4 0 0 0 -3 -3.85" /></svg></svg><text x="90" y="358" font-size="13.5" font-weight="600" fill="#E9EDF0">Exploitant réseau</text><text x="90" y="373" font-size="10.5" fill="#9FADB9">personne</text><text x="52" y="398" font-size="10.5" fill="#9FADB9">Supervise le parc, traite les incidents et</text><text x="52" y="412" font-size="10.5" fill="#9FADB9">vérifie les décomptes avant émission.</text></g>
  <g><rect x="40" y="540" width="250" height="130" rx="3" fill="#272D34" stroke="#8A96A2" stroke-width="1.6"/><svg x="52" y="554" width="30" height="30" viewBox="0 0 48 48"><rect width="48" height="48" rx="13" fill="#eff0f1"/><svg x="9" y="9" width="30" height="30" viewBox="0 0 24 24" fill="none" stroke="#4C5A66" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path stroke="none" d="M0 0h24v24H0z" fill="none" /><path d="M12 12l0 .01" /><path d="M14.828 9.172a4 4 0 0 1 0 5.656" /><path d="M17.657 6.343a8 8 0 0 1 0 11.314" /><path d="M9.168 14.828a4 4 0 0 1 0 -5.656" /><path d="M6.337 17.657a8 8 0 0 1 0 -11.314" /></svg></svg><text x="90" y="568" font-size="13.5" font-weight="600" fill="#E9EDF0">Borne de recharge</text><text x="90" y="583" font-size="10.5" fill="#9FADB9">matériel · 2 400 unités</text><text x="52" y="608" font-size="10.5" fill="#9FADB9">Mesure l’énergie délivrée et remonte un</text><text x="52" y="622" font-size="10.5" fill="#9FADB9">relevé par session.</text></g>
