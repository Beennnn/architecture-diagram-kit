  <g><rect x="880" y="120" width="300" height="150" rx="8" fill="#22272E" stroke="#7B8894" stroke-width="1.6" stroke-dasharray="5 4"/><svg x="892" y="134" width="30" height="30" viewBox="0 0 48 48"><rect width="48" height="48" rx="13" fill="#f2edfc"/><svg x="9" y="9" width="30" height="30" viewBox="0 0 24 24" fill="none" stroke="#7038D8" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path stroke="none" d="M0 0h24v24H0z" fill="none" /><path d="M4.876 13.61a4 4 0 1 0 6.124 3.39h6" /><path d="M15.066 20.502a4 4 0 1 0 1.934 -7.502c-.706 0 -1.424 .179 -2 .5l-3 -5.5" /><path d="M16 8a4 4 0 1 0 -8 0c0 1.506 .77 2.818 2 3.5l-3 5.5" /></svg></svg><text x="930" y="148" font-size="13.5" font-weight="600" fill="#E9EDF0">Fournisseur d’énergie</text><text x="930" y="163" font-size="10.5" fill="#9FADB9">système externe</text><text x="892" y="188" font-size="10.5" fill="#9FADB9">Publie les tarifs horaires que Voltis applique au</text><text x="892" y="202" font-size="10.5" fill="#9FADB9">calcul des décomptes.</text></g>
