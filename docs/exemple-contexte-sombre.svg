  <text x="40" y="44" font-size="18" font-weight="600" fill="#E9EDF0">Voltis — contexte</text>
  <text x="40" y="66" font-size="12.5" fill="#9FADB9">Niveau contexte · qui se sert du système, et avec quoi il parle</text>
  
