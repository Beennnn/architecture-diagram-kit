<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="646" viewBox="0 0 1000 646" font-family="'IBM Plex Sans','Helvetica Neue',Arial,sans-serif" role="img" aria-label="The nine shapes of the grammar"><rect width="1000" height="646" fill="#FFFFFF"/><text x="30" y="30" font-size="15" font-weight="700" fill="#16181A">The nine shapes</text><text x="30" y="50" font-size="12" fill="#5B6873">The shape encodes the NATURE of an object, never its importance nor its state.</text><text x="30" y="68" font-size="11" fill="#8896A2">Drawn here by box() itself — the same primitive every view uses.</text><rect x="40" y="118" width="280" height="92" rx="0" fill="#FFFFFF" stroke="#3E444A" stroke-width="1.6"/><text x="56" y="152" font-size="13" font-family="'IBM Plex Mono',monospace" font-weight="600" fill="#16181A">service</text><text x="56" y="172" font-size="11" fill="#5B6873">a component that runs code</text><text x="56" y="192" font-size="9.5" font-family="'IBM Plex Mono',monospace" fill="#8896A2">fill #FFFFFF · 1.000:1 on white</text><rect x="360" y="118" width="280" height="92" rx="10" fill="#FFFFFF" stroke="#3E444A" stroke-width="1.6"/><text x="376" y="152" font-size="13" font-family="'IBM Plex Mono',monospace" font-weight="600" fill="#16181A">application</text><text x="376" y="172" font-size="11" fill="#5B6873">something a person interacts with</text><text x="376" y="192" font-size="9.5" font-family="'IBM Plex Mono',monospace" fill="#8896A2">fill #FFFFFF · 1.000:1 on white</text><path d="M680 132 v64 a140 13 0 0 0 280 0 v-64" fill="#FFFFFF" stroke="#3E444A" stroke-width="1.6"/><ellipse cx="820" cy="132" rx="140" ry="13" fill="#FFFFFF" stroke="#3E444A" stroke-width="1.6"/><text x="696" y="152" font-size="13" font-family="'IBM Plex Mono',monospace" font-weight="600" fill="#16181A">store</text><text x="696" y="172" font-size="11" fill="#5B6873">data that survives a restart</text><text x="696" y="192" font-size="9.5" font-family="'IBM Plex Mono',monospace" fill="#8896A2">fill #FFFFFF · 1.000:1 on white</text><rect x="40" y="250" width="280" height="92" rx="46" fill="#FFFFFF" stroke="#3E444A" stroke-width="1.6"/><text x="56" y="284" font-size="13" font-family="'IBM Plex Mono',monospace" font-weight="600" fill="#16181A">stream</text><text x="56" y="304" font-size="11" fill="#5B6873">a queue, a topic, a bus</text><text x="56" y="324" font-size="9.5" font-family="'IBM Plex Mono',monospace" fill="#8896A2">fill #FFFFFF · 1.000:1 on white</text><rect x="360" y="250" width="280" height="92" rx="10" fill="#E8ECEF" stroke="#3E444A" stroke-width="1.6"/><text x="376" y="284" font-size="13" font-family="'IBM Plex Mono',monospace" font-weight="600" fill="#16181A">actor</text><text x="376" y="304" font-size="11" fill="#5B6873">a person, or their workstation</text><text x="376" y="324" font-size="9.5" font-family="'IBM Plex Mono',monospace" fill="#8896A2">fill #E8ECEF · 1.188:1 on white</text><rect x="680" y="250" width="280" height="92" rx="3" fill="#EDF0F2" stroke="#3E444A" stroke-width="1.6"/><text x="696" y="284" font-size="13" font-family="'IBM Plex Mono',monospace" font-weight="600" fill="#16181A">device</text><text x="696" y="304" font-size="11" fill="#5B6873">physical equipment outside the IS</text><text x="696" y="324" font-size="9.5" font-family="'IBM Plex Mono',monospace" fill="#8896A2">fill #EDF0F2 · 1.145:1 on white</text><rect x="40" y="382" width="280" height="92" rx="2" fill="#DFE5E9" stroke="#3E444A" stroke-width="2.4"/><text x="56" y="416" font-size="13" font-family="'IBM Plex Mono',monospace" font-weight="600" fill="#16181A">node</text><text x="56" y="436" font-size="11" fill="#5B6873">a machine that hosts</text><text x="56" y="456" font-size="9.5" font-family="'IBM Plex Mono',monospace" fill="#8896A2">fill #DFE5E9 · 1.271:1 on white</text><rect x="360" y="382" width="280" height="92" rx="8" fill="#F3F5F6" stroke="#8896A2" stroke-width="1.6" stroke-dasharray="5 4"/><text x="376" y="416" font-size="13" font-family="'IBM Plex Mono',monospace" font-weight="600" fill="#16181A">external</text><text x="376" y="436" font-size="11" fill="#5B6873">a system outside our control</text><text x="376" y="456" font-size="9.5" font-family="'IBM Plex Mono',monospace" fill="#8896A2">fill #F3F5F6 · 1.094:1 on white</text><rect x="680" y="382" width="280" height="92" rx="12" fill="#F2F5F6" stroke="#8896A2" stroke-width="1.3" stroke-dasharray="8 6"/><text x="696" y="416" font-size="13" font-family="'IBM Plex Mono',monospace" font-weight="600" fill="#16181A">boundary</text><text x="696" y="436" font-size="11" fill="#5B6873">a zone: network, trust, deployment</text><text x="696" y="456" font-size="9.5" font-family="'IBM Plex Mono',monospace" fill="#8896A2">fill #F2F5F6 · 1.096:1 on white</text><rect x="40" y="514" width="280" height="92" rx="0" fill="#FFFFFF" stroke="#A3196F" stroke-width="3.2"/><text x="56" y="548" font-size="13" font-family="'IBM Plex Mono',monospace" font-weight="600" fill="#A3196F">featured</text><text x="56" y="568" font-size="11" fill="#5B6873">the subject of the diagram — at most one</text><text x="56" y="588" font-size="9.5" font-family="'IBM Plex Mono',monospace" fill="#8896A2">#A3196F · not a seventh layer</text><rect x="360" y="514" width="280" height="92" rx="12" fill="#E7EBEE" stroke="#8896A2" stroke-width="1.3" stroke-dasharray="8 6"/><text x="376" y="548" font-size="13" font-family="'IBM Plex Mono',monospace" font-weight="600" fill="#16181A">boundary, nested</text><text x="376" y="568" font-size="11" fill="#5B6873">a zone inside another zone</text><text x="376" y="588" font-size="9.5" font-family="'IBM Plex Mono',monospace" fill="#8896A2">fill #E7EBEE · one step darker</text></svg>
